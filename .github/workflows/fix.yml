name: Fix ResizeObserver bug
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix variable name
        run: sed -i "s/var rg=new ResizeObserver/var ro=new ResizeObserver/g" index.html
      - name: Commit fix
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix ResizeObserver variable name: rg -> ro"
          git push
