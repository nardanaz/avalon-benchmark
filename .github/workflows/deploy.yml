name: Add persistence to dashboard
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add persistence code
        env:
          PATCH_B64: ""
        run: |
          python3 -c "
          import os, base64
          patch = base64.b64decode(os.environ['PATCH_B64']).decode()
          target = 'const [viewClientData, setViewClientData] = useState(null);'
          with open('index.html','r') as f: c = f.read()
          assert target in c, 'Target string not found'
          c = c.replace(target, target + patch, 1)
          with open('index.html','w') as f: f.write(c)
          print('Persistence code injected successfully')
          "
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add server-side persistence for client data"
          git push
      - name: Cleanup workflow
        run: |
          git rm .github/workflows/deploy.yml
          git commit -m "Remove deploy workflow"
          git push
